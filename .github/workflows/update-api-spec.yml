name: "Update API spec"

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-spec:
    name: Update OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - run: source ./.github/scripts/lang-runtime-versions.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: pulumi/pulumictl
          tag: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch OpenAPI spec
        run: |
          make fetch_api_spec

      - name: Exit if no changes
        run: |
          git update-index -q --refresh
          if git diff-files --quiet; then
              exit 0
          fi

      - name: Create PR
        uses: peter-evans/create-pull-request@bd09a93810788ce61d2d5fb7d6b221b9b4a4aab7
        with:
          branch: automated/update-openapi-spec
          delete-branch: true
          commit-message: "Update DigitalOcean OpenAPI spec"
          title: "Update DigitalOcean OpenAPI spec"
          body: |
            Automated update of the Fly Machines OpenAPI spec from https://api-engineering.nyc3.digitaloceanspaces.com/spec-ci/DigitalOcean-public.v2.yaml.

            See https://github.com/digitalocean/openapi for API spec sources.

            **Note**: This PR was generated by `${{ github.workflow }}`.
