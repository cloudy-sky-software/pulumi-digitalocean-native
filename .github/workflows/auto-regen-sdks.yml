on:
  push:
    paths:
      - spec.json
      - "provider/**/openapi.yml"
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  regen-sdks:
    name: Regen Pulumi SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags

      - run: source ./.github/scripts/lang-runtime-versions.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: pulumi/pulumictl
          tag: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@598b17045ce608f3af1f68e06c04649a0ab4a829
        with:
          pulumi-version: latest

      - name: Generate Pulumi schema
        run: make gen generate_schema

      - name: Build SDKs
        run: make build

      - name: Create PR
        uses: peter-evans/create-pull-request@bd09a93810788ce61d2d5fb7d6b221b9b4a4aab7
        with:
          branch: automated/regen-sdks
          delete-branch: true
          commit-message: "Regen SDKs"
          title: "Regen SDKs"
          body: |
            Automated regen of Pulumi SDKs.

            **Note**: This PR was generated by `${{ github.workflow }}`.
